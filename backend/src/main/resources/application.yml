spring:
  application:
    name: booki-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

booki:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-secret-32bytes}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    pdf-path: ${PDF_STORAGE_PATH:./uploads}
    report-path: ${REPORT_STORAGE_PATH:./reports}
  ai:
    default-provider: ${AI_PROVIDER:claude}
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-5}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
    kimi:
      api-key: ${KIMI_API_KEY:}
      base-url: https://api.moonshot.cn/v1
      model: kimi-k2
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.2:1b}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:booki}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:booki}
    password: ${MYSQL_PASSWORD:booki}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
booki:
  ai:
    default-provider: ${AI_PROVIDER:claude}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:~/booki-local-db;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
booki:
  ai:
    default-provider: ${AI_PROVIDER:ollama}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
