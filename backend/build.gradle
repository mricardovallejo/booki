plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.booki'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Database migration — Spring Boot 4 modularized autoconfiguration: the
	// starter is what wires Flyway in, flyway-core alone is a silent no-op.
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'

	// MySQL driver
	runtimeOnly 'com.mysql:mysql-connector-j'

	// H2 for local development and tests
	runtimeOnly 'com.h2database:h2'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// JWT — jjwt-gson instead of jjwt-jackson: jjwt 0.12.6 predates Jackson 3
	// (Spring Boot 4's default), so this sidesteps the Jackson 2/3 split
	// entirely for a concern this narrow (just JWT claims (de)serialization).
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.6'

	// PDF text extraction
	implementation 'org.apache.pdfbox:pdfbox:3.0.3'

	// OpenAPI contract, generated live from the controllers (see docs/openapi.yaml
	// for the hand-written design contract this must stay in sync with)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Loads the monorepo's .env (one level up from backend/, alongside .env.example)
// so ANTHROPIC_API_KEY etc. don't have to be exported by hand in every terminal.
// A variable already set in the real shell environment always wins — .env only
// fills in what's missing, same convention as dotenv tooling elsewhere.
def dotEnvFile = file("${rootDir}/../.env")
def dotEnvVars = [:]
if (dotEnvFile.exists()) {
	dotEnvFile.eachLine { line ->
		line = line.trim()
		if (line && !line.startsWith('#')) {
			int idx = line.indexOf('=')
			if (idx > 0) {
				def key = line.substring(0, idx).trim()
				def value = line.substring(idx + 1).trim()
				if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
					value = value.substring(1, value.length() - 1)
				}
				dotEnvVars[key] = value
			}
		}
	}
}

tasks.named('bootRun') {
	systemProperty 'spring.profiles.active', 'dev'
	dotEnvVars.each { k, v -> if (!environment.containsKey(k)) environment(k, v) }
}

tasks.register('bootRunLocal', org.springframework.boot.gradle.tasks.run.BootRun.class) {
	group = 'application'
	description = 'Run the backend with the local H2 profile'
	mainClass = tasks.named('bootRun').get().mainClass
	classpath = sourceSets.main.runtimeClasspath
	systemProperty 'spring.profiles.active', 'local'
	dotEnvVars.each { k, v -> if (!environment.containsKey(k)) environment(k, v) }
}
