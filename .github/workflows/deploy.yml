name: Deploy (dev)

# Backend to Cloud Run, frontend to Firebase Hosting.
# Runbook + the list of secrets/vars this needs: docs/deployment.md Phase 5-6.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      # Cloud Run builds the image from backend/Dockerfile (Cloud Build) and
      # deploys it. Env vars go via a file so values with commas/special chars
      # are safe. Flyway runs V1 on first boot.
      - name: Deploy backend to Cloud Run
        id: deploy
        run: |
          cat > env.yaml <<EOF
          SPRING_PROFILES_ACTIVE: "dev"
          DB_HOST: "${{ secrets.DB_HOST }}"
          DB_PORT: "${{ secrets.DB_PORT }}"
          DB_NAME: "${{ secrets.DB_NAME }}"
          DB_USER: "${{ secrets.DB_USER }}"
          DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
          DB_SSLMODE: "require"
          JWT_SECRET: "${{ secrets.JWT_SECRET }}"
          AI_PROVIDER: "openai"
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
          CORS_ALLOWED_ORIGINS: "${{ secrets.CORS_ALLOWED_ORIGINS }}"
          STORAGE_DRIVER: "s3"
          S3_ENDPOINT: "https://storage.googleapis.com"
          S3_BUCKET: "${{ secrets.S3_BUCKET }}"
          S3_ACCESS_KEY: "${{ secrets.S3_ACCESS_KEY }}"
          S3_SECRET_KEY: "${{ secrets.S3_SECRET_KEY }}"
          S3_PATH_STYLE: "true"
          EOF
          URL=$(gcloud run deploy booki-backend \
            --quiet \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --source backend \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --memory 512Mi \
            --port 8080 \
            --env-vars-file env.yaml \
            --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Backend: $URL"

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build with the backend URL baked in
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ needs.backend.outputs.url }}/api
        run: |
          npm ci
          npm run build

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy frontend to Firebase Hosting
        working-directory: frontend
        run: >
          npx --yes firebase-tools@13 deploy --only hosting
          --project "${{ secrets.GCP_PROJECT_ID }}" --non-interactive
