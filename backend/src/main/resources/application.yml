spring:
  application:
    name: booki-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

logging:
  level:
    # Off by default — very noisy, and rarely what you actually want to read.
    # Turn it on for one run without touching this file:
    #   LOGGING_LEVEL_ORG_HIBERNATE_SQL=debug ./gradlew bootRunLocal
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    com.booki: info

booki:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-secret-32bytes}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    # local (files under local-path) | s3 (any S3-compatible: MinIO, R2, GCS, AWS)
    driver: ${STORAGE_DRIVER:local}
    local-path: ${STORAGE_LOCAL_PATH:./storage}
    s3:
      # Blank endpoint => real AWS. Set it for MinIO / R2 / GCS. See docs/deployment.md.
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:booki}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:true}
  conversation:
    # How many of the most recent messages are replayed to the model as context.
    history-window: ${CONVERSATION_HISTORY_WINDOW:20}
    # Upper bound on the session page-range text sent with a turn, so a very wide
    # range cannot produce an unbounded LLM request.
    max-context-chars: ${CONVERSATION_MAX_CONTEXT_CHARS:24000}
  voice:
    # Reject oversized audio uploads before they reach the STT provider (10 MB).
    max-audio-bytes: ${VOICE_MAX_AUDIO_BYTES:10485760}
    # Server-side STT/TTS. Blank api-key => voice falls back to the browser
    # recognizer; the session language (not a hardcoded locale) drives STT.
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      stt-model: ${VOICE_STT_MODEL:whisper-1}
      tts-model: ${VOICE_TTS_MODEL:gpt-4o-mini-tts}
      tts-voice: ${VOICE_TTS_VOICE:alloy}
      tts-max-input-chars: ${VOICE_TTS_MAX_INPUT_CHARS:1200}
  ai:
    default-provider: ${AI_PROVIDER:openai}
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-5}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
    kimi:
      api-key: ${KIMI_API_KEY:}
      base-url: ${KIMI_BASE_URL:https://api.moonshot.cn/v1}
      model: ${KIMI_MODEL:kimi-k2}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.2:1b}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # sslmode: 'disable' for the local Docker Postgres; set DB_SSLMODE=require
    # for a managed database (Neon, Cloud SQL, …). See docs/deployment.md.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booki}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:booki}
    password: ${DB_PASSWORD:booki}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
booki:
  ai:
    default-provider: ${AI_PROVIDER:openai}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:~/booki-local-db;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
booki:
  ai:
    default-provider: ${AI_PROVIDER:ollama}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
