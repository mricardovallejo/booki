services:
  db:
    image: postgres:16
    container_name: booki-postgres
    environment:
      POSTGRES_DB: booki
      POSTGRES_USER: booki
      POSTGRES_PASSWORD: booki
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booki -d booki"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
