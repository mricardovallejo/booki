services:
  db:
    image: postgres:16
    container_name: booki-postgres
    environment:
      POSTGRES_DB: booki
      POSTGRES_USER: booki
      POSTGRES_PASSWORD: booki
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booki -d booki"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for local dev/testing of booki.storage.driver=s3.
  # Not needed for day-to-day work (default driver is 'local').
  minio:
    image: minio/minio
    container_name: booki-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: booki
      MINIO_ROOT_PASSWORD: bookibooki
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console (http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the 'booki' bucket, then exit.
  minio-setup:
    image: minio/mc
    container_name: booki-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 booki bookibooki; do sleep 1; done;
      mc mb --ignore-existing local/booki;
      "

volumes:
  postgres_data:
  minio_data:
